<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vote</title>

<style>
body { font-family: sans-serif; text-align: center; margin-top: 60px; }
button {
  font-size: 2.5em; margin: 10px; padding: 20px 30px;
  border: 2px solid #444; background: #eee; cursor: pointer;
}
button.selected {
  background: #4a90e2; color: white; border-color: #2c5aa0;
}
pre { font-size: 1.4em; margin-top: 30px; text-align: left; display: inline-block; }
.bar { color: #444; }
.bar.mine { color: #c0392b; }
</style>
</head>

<body>

<h2 id="title">Welcome</h2>
<p id="subtitle">Please wait for the poll to open.</p>

<div id="buttons" style="display:none;"></div>
<pre id="output"></pre>

<script>
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const buttons = document.getElementById("buttons");
const output = document.getElementById("output");

let lastOpen = null;
let hasSeenOpen = false;
let myVote = null;
let currentOptions = [];

/* ---------- device identity ---------- */
let deviceId = localStorage.getItem("device_id");
if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("device_id", deviceId);
}

/* ---------- helpers ---------- */
function bar(n, max) {
  if (!max) return "";
  return "█".repeat(Math.round(20 * n / max));
}
function updateButtonStyles() {
  [...buttons.children].forEach(b =>
    b.classList.toggle("selected", b.textContent === myVote)
  );
}

/* ---------- sync options ---------- */
async function syncOptions() {
  const r = await fetch("/options");
  const j = await r.json();

  if (JSON.stringify(j.options) === JSON.stringify(currentOptions)) return;

  currentOptions = j.options.slice();
  if (!currentOptions.includes(myVote)) myVote = null;

  buttons.innerHTML = "";
  currentOptions.forEach(l => {
    const b = document.createElement("button");
    b.textContent = l;
    b.onclick = () => vote(l);
    buttons.appendChild(b);
  });
  updateButtonStyles();
}

/* ---------- poll state ---------- */
async function pollState() {
  await syncOptions();

  const r = await fetch("/state");
  const j = await r.json();

  if (j.open !== lastOpen) {
    lastOpen = j.open;
    if (j.open) {
      hasSeenOpen = true;
      title.textContent = "Voting OPEN";
      subtitle.textContent = "Select your answer.";
      output.textContent = "";
      buttons.style.display = "block";
    } else {
      buttons.style.display = "none";
      if (hasSeenOpen) showResults();
      else {
        title.textContent = "Welcome";
        subtitle.textContent = "Please wait for the poll to open.";
        output.textContent = "";
      }
    }
  }
}

/* ---------- results ---------- */
async function showResults() {
  const r = await fetch("/results");
  const j = await r.json();

  title.textContent = "Results";
  subtitle.textContent = "";

  const max = Math.max(...j.options.map(o => j.counts[o]));
  let text = "";
  j.options.forEach(o => {
    const cls = (o === myVote) ? "bar mine" : "bar";
    text += `${o}: <span class="${cls}">${bar(j.counts[o], max)}</span> ${j.counts[o]}\n`;
  });
  output.innerHTML = text;
}

/* ---------- vote ---------- */
async function vote(letter) {
  myVote = letter;
  updateButtonStyles();
  await fetch("/vote", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({letter, device_id: deviceId})
  });
}

pollState();
setInterval(pollState, 1000);
</script>

</body>
</html>
