<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vote</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin-top: 60px;
  }
  button {
    font-size: 2.5em;
    margin: 10px;
    padding: 20px 30px;
    border: 2px solid #444;
    background: #eee;
    cursor: pointer;
  }
  button.selected {
    background: #4a90e2;
    color: white;
    border-color: #2c5aa0;
  }
  pre {
    font-size: 1.4em;
    margin-top: 30px;
    line-height: 1.4;
    text-align: left;
    display: inline-block;
  }
  .bar {
    color: #444;
  }
  .bar.mine {
    color: #c0392b; /* red for own vote */
  }
</style>
</head>

<body>

<h2 id="title">Welcome</h2>
<p id="subtitle">Please wait for the poll to open.</p>

<div id="buttons" style="display:none;"></div>

<pre id="output"></pre>

<script>
const title    = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const buttons  = document.getElementById("buttons");
const output   = document.getElementById("output");

let lastOpen = null;
let hasSeenOpen = false;
let myVote = null;

function bar(n, max) {
  if (max === 0) return "";
  return "█".repeat(Math.round(20 * n / max));
}

function updateButtonStyles() {
  Array.from(buttons.children).forEach(b =>
    b.classList.toggle("selected", b.textContent === myVote)
  );
}

async function loadOptions() {
  const r = await fetch("/options");
  const j = await r.json();

  buttons.innerHTML = "";
  j.options.forEach(letter => {
    const b = document.createElement("button");
    b.textContent = letter;
    b.onclick = () => vote(letter);
    buttons.appendChild(b);
  });
}

async function pollState() {
  const r = await fetch("/state");
  const j = await r.json();

  if (j.open !== lastOpen) {
    lastOpen = j.open;

    if (j.open) {
      hasSeenOpen = true;
      title.textContent = "Voting OPEN";
      subtitle.textContent = "Select your answer.";
      output.textContent = "";
      buttons.style.display = "block";
      updateButtonStyles();
    } else {
      buttons.style.display = "none";
      if (hasSeenOpen) showResults();
      else {
        title.textContent = "Welcome";
        subtitle.textContent = "Please wait for the poll to open.";
        output.textContent = "";
      }
    }
  }
}

async function showResults() {
  const r = await fetch("/results");
  const j = await r.json();

  title.textContent = "Results";
  subtitle.textContent = "";

  let max = Math.max(...j.options.map(k => j.counts[k]));
  let text = "";

  j.options.forEach(k => {
    const cls = (k === myVote) ? "bar mine" : "bar";
    text += `${k}: <span class="${cls}">${bar(j.counts[k], max)}</span> ${j.counts[k]}\n`;
  });

  output.innerHTML = text;
}

async function vote(letter) {
  myVote = letter;
  updateButtonStyles();
  await fetch("/vote", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({letter})
  });
}

loadOptions();
pollState();
setInterval(pollState, 1000);
</script>

</body>
</html>
