<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote</title>

<style>
  body {
    font-family: sans-serif;
    margin: 20px auto;
    max-width: 600px;
  }

  h2, p {
    text-align: center;
  }

  #subtitle {
    min-height: 1.6em;
  }

  .option {
    display: flex;
    align-items: center;
    margin: 14px 0;
    padding-left: 10%;
    padding-right: 10%;
  }

  button.vote {
    width: 100px;
    height: 100px;
    font-size: 2.2em;
    font-weight: bold;
    border: 2px solid #444;
    background: #eee;
    cursor: pointer;
    flex-shrink: 0;
  }

  button.vote.selected {
    background: #4a90e2;
    color: white;
    border-color: #2c5aa0;
  }

  /* disabled state after poll close */
  button.vote:disabled {
    cursor: default;
    opacity: 0.85;
  }

  .barbox {
    flex-grow: 1;
    height: 42px;
    margin-left: 18px;
    background: #e0e0e0;
    position: relative;
    display: none;
  }

  .barfill {
    height: 100%;
    background: #888;
    width: 0%;
  }

  .count {
    position: absolute;
    right: 10px;
    top: 6px;
    font-size: 1.4em;
    font-weight: bold;
  }
</style>
</head>

<body>

<h2 id="title">Welcome</h2>
<p id="subtitle">Please wait for the poll to open.</p>

<div id="options"></div>

<script>
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const optionsDiv = document.getElementById("options");

let currentOptions = [];
let myVote = null;
let pollOpen = null;
let sessionClosed = false;

/* ---------- build options ---------- */
function buildOptions(opts) {
  optionsDiv.innerHTML = "";
  currentOptions = opts.slice();

  opts.forEach(letter => {
    const row = document.createElement("div");
    row.className = "option";

    const btn = document.createElement("button");
    btn.className = "vote";
    btn.textContent = letter;
    btn.onclick = () => vote(letter);

    const barbox = document.createElement("div");
    barbox.className = "barbox";

    const barfill = document.createElement("div");
    barfill.className = "barfill";

    const count = document.createElement("div");
    count.className = "count";

    barbox.appendChild(barfill);
    barbox.appendChild(count);

    row.appendChild(btn);
    row.appendChild(barbox);
    optionsDiv.appendChild(row);
  });

  updateButtonStyles();
  updateButtonEnabled();
}

/* ---------- helpers ---------- */
function updateButtonStyles() {
  document.querySelectorAll("button.vote").forEach(b => {
    b.classList.toggle("selected", b.textContent === myVote);
  });
}

function updateButtonEnabled() {
  document.querySelectorAll("button.vote").forEach(b => {
    b.disabled = !pollOpen;
  });
}

/* ---------- sync options ---------- */
async function syncOptions() {
  const r = await fetch("/options");
  const j = await r.json();

  if (JSON.stringify(j.options) !== JSON.stringify(currentOptions)) {
    if (!j.options.includes(myVote)) myVote = null;
    buildOptions(j.options);
  }
}

/* ---------- poll state ---------- */
async function pollState() {
  await syncOptions();

  const r = await fetch("/state");
  const s = await r.json();

  pollOpen = s.open;
  sessionClosed = s.session_closed;

  if (sessionClosed) {
    title.textContent = "Thank you";
    subtitle.textContent = "Polls are closed. Have a nice day.";
    optionsDiv.style.display = "none";
    return;
  }

  if (pollOpen) {
    title.textContent = "Voting OPEN";
    subtitle.textContent = "Select your answer.";
    hideBars();
    optionsDiv.style.display = "block";
  } else {
    title.textContent = "Poll CLOSED";
    subtitle.textContent = "Class results:";
    showResults();
  }

  updateButtonEnabled();
}

/* ---------- hide bars ---------- */
function hideBars() {
  document.querySelectorAll(".barbox").forEach(b => {
    b.style.display = "none";
  });
}

/* ---------- show results ---------- */
async function showResults() {
  const r = await fetch("/results");
  const j = await r.json();

  let max = 0;
  j.options.forEach(o => max = Math.max(max, j.counts[o]));

  document.querySelectorAll(".option").forEach(row => {
    const letter = row.querySelector("button").textContent;
    const barbox = row.querySelector(".barbox");
    const barfill = row.querySelector(".barfill");
    const count = row.querySelector(".count");

    const n = j.counts[letter] || 0;
    const pct = max ? Math.round(100 * n / max) : 0;

    barfill.style.width = pct + "%";
    count.textContent = n;
    barbox.style.display = "block";
  });
}

/* ---------- vote ---------- */
async function vote(letter) {
  if (!pollOpen) return;   // HARD GUARD

  myVote = letter;
  updateButtonStyles();

  await fetch("/vote", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({letter})
  });
}

/* ---------- init ---------- */
pollState();
setInterval(pollState, 1000);
</script>

</body>
</html>
