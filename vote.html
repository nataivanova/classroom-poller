<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vote</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin-top: 60px;
  }
  button {
    font-size: 2.5em;
    margin: 10px;
    padding: 20px 30px;
  }
  pre {
    font-size: 1.5em;
    margin-top: 30px;
  }
</style>
</head>

<body>

<h2 id="title">Welcome</h2>
<p id="subtitle">Please wait for the poll to open.</p>

<div id="buttons" style="display:none;"></div>

<pre id="output"></pre>

<script>
const title    = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const buttons  = document.getElementById("buttons");
const output   = document.getElementById("output");

let lastOpen = null;
let hasSeenOpen = false;

/* ---------- load allowed options ---------- */
async function loadOptions() {
  const r = await fetch("/options");
  const j = await r.json();

  buttons.innerHTML = "";
  j.options.forEach(letter => {
    const b = document.createElement("button");
    b.textContent = letter;
    b.onclick = () => vote(letter);
    buttons.appendChild(b);
  });
}

/* ---------- state polling ---------- */
async function pollState() {
  const r = await fetch("/state");
  const j = await r.json();

  if (j.open !== lastOpen) {
    lastOpen = j.open;

    if (j.open) {
      // poll just opened
      hasSeenOpen = true;
      title.textContent = "Voting OPEN";
      subtitle.textContent = "Please select your answer.";
      output.textContent = "";
      buttons.style.display = "block";

    } else {
      // poll is closed
      buttons.style.display = "none";

      if (hasSeenOpen) {
        // show results only if this session saw the poll open
        showResults();
      } else {
        // fresh load before poll opens
        title.textContent = "Welcome";
        subtitle.textContent = "Please wait for the poll to open.";
        output.textContent = "";
      }
    }
  }
}

/* ---------- show results ---------- */
async function showResults() {
  const r = await fetch("/results");
  const j = await r.json();

  title.textContent = "Results";
  subtitle.textContent = "";

  let text = "";
  j.options.forEach(k => {
    text += `${k}: ${j.counts[k]}\n`;
  });
  output.textContent = text;
}

/* ---------- submit vote ---------- */
async function vote(letter) {
  await fetch("/vote", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({letter})
  });
}

/* ---------- init ---------- */
loadOptions();
pollState();
setInterval(pollState, 1000);
</script>

</body>
</html>
