<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Poll Admin</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 40px auto;
  }
  button {
    font-size: 1.2em;
    margin: 5px;
    padding: 10px 15px;
  }
  pre {
    background: #f4f4f4;
    padding: 15px;
    margin-top: 20px;
    font-size: 1.1em;
  }
</style>
</head>

<body>

<h2>Poll Admin</h2>

<h3>Answer options</h3>
<button onclick="setOptions(['A','B','C','D'])">A–D</button>
<button onclick="setOptions(['A','B','C','D','E'])">A–E</button>

<h3>Control</h3>
<button onclick="openPoll()">OPEN POLL</button>
<button onclick="closePoll()">CLOSE POLL</button>

<h3>Status</h3>
<pre id="status">Initializing…</pre>

<script>
const statusBox = document.getElementById("status");

/* ---------- admin actions ---------- */
async function setOptions(opts) {
  await fetch("/set_options", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({options: opts})
  });
  updateStatus();
}

async function openPoll() {
  await fetch("/open", {method: "POST"});
  updateStatus();
}

async function closePoll() {
  await fetch("/close", {method: "POST"});
  updateStatus();
}

/* ---------- status polling ---------- */
async function updateStatus() {
  const r = await fetch("/results");
  const j = await r.json();

  let total = 0;
  let lines = [];

  j.options.forEach(k => {
    const n = j.counts[k] || 0;
    total += n;
    lines.push(`${k}: ${n}`);
  });

  statusBox.textContent =
    `Poll: ${j.open ? "OPEN" : "CLOSED"}\n` +
    `Options: ${j.options.join(", ")}\n\n` +
    `Votes:\n` +
    lines.join("\n") +
    `\n\nTotal votes: ${total}`;
}

/* ---------- auto refresh ---------- */
updateStatus();
setInterval(updateStatus, 1000);
</script>

</body>
</html>
