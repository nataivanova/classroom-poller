<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Poll Admin</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
  }
  button {
    font-size: 1.2em;
    margin: 5px;
    padding: 10px 15px;
  }
  pre {
    background: #f4f4f4;
    padding: 15px;
    margin-top: 20px;
    font-size: 1.05em;
    line-height: 1.4;
  }
</style>
</head>

<body>

<h2>Poll Admin</h2>

<h3>Answer options</h3>
<button onclick="setOptions(['A','B','C','D'])">A–D</button>
<button onclick="setOptions(['A','B','C','D','E'])">A–E</button>

<h3>Control</h3>
<button onclick="openPoll()">OPEN POLL</button>
<button onclick="closePoll()">CLOSE POLL</button>

<h3>Status</h3>
<pre id="status">Initializing…</pre>

<script>
const statusBox = document.getElementById("status");

let lastTotal = 0;
let lastChangeTime = Date.now();
let pollOpenTime = null;

/* ---------- admin actions ---------- */
async function setOptions(opts) {
  await fetch("/set_options", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({options: opts})
  });
  pollOpenTime = null;
  lastTotal = 0;
  updateStatus();
}

async function openPoll() {
  await fetch("/open", {method: "POST"});
  pollOpenTime = Date.now();
  lastTotal = 0;
  lastChangeTime = Date.now();
  updateStatus();
}

async function closePoll() {
  await fetch("/close", {method: "POST"});
  updateStatus();
}

/* ---------- helpers ---------- */
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}

function bar(n, max) {
  if (max === 0) return "";
  const width = Math.round(20 * n / max);
  return "█".repeat(width);
}

/* ---------- status polling ---------- */
async function updateStatus() {
  const r = await fetch("/results");
  const j = await r.json();

  let total = 0;
  let max = 0;
  let lines = [];

  j.options.forEach(k => {
    const n = j.counts[k] || 0;
    total += n;
    if (n > max) max = n;
  });

  // freeze detection
  if (total !== lastTotal) {
    lastTotal = total;
    lastChangeTime = Date.now();
  }

  const frozen = (Date.now() - lastChangeTime) > 10000; // 10 s
  const elapsed = (j.open && pollOpenTime)
    ? formatTime(Date.now() - pollOpenTime)
    : "00:00";

  j.options.forEach(k => {
    const n = j.counts[k] || 0;
    lines.push(`${k}: ${bar(n, max)} ${n}`);
  });

  statusBox.textContent =
    `Poll: ${j.open ? "OPEN" : "CLOSED"}\n` +
    `Options: ${j.options.join(", ")}\n\n` +
    `Votes:\n` +
    lines.join("\n") +
    `\n\nTotal votes: ${total}\n` +
    `Time since open: ${elapsed}\n` +
    `Status: ${frozen ? "FROZEN (no new votes)" : "ACTIVE"}`;
}

/* ---------- auto refresh ---------- */
updateStatus();
setInterval(updateStatus, 1000);
</script>

</body>
</html>
