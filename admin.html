<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poll Admin</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 30px auto;
  }

  button {
    font-size: 1.1em;
    margin: 5px;
    padding: 10px 15px;
  }

  button.active {
    background: #2c5aa0;
    color: white;
  }

  pre {
    background: #f4f4f4;
    padding: 12px;
    margin-top: 12px;
    font-size: 1.05em;
    line-height: 1.35;
  }

  /* ---------- MOBILE OVERRIDES ---------- */
  @media (pointer: coarse) and (max-width: 900px) {

    body {
      max-width: 96%;
      margin: 12px auto;
    }

    h2 {
      font-size: 1.6em;
      margin-bottom: 8px;
    }

    /* buttons stacked, slightly smaller */
    button {
      display: block;
      width: 100%;
      font-size: 1.9em;        /* ~20% smaller than before */
      padding: 18px 0;
      margin: 10px 0;
    }

    pre {
      font-size: 1.35em;
      padding: 12px;
      margin-top: 10px;
    }
  }
</style>
</head>

<body>

<h2>Poll Admin</h2>

<!-- START / SELECT buttons -->
<button id="opt-3" onclick="startPoll(['A','B','C'])">A–B–C</button>
<button id="opt-4" onclick="startPoll(['A','B','C','D'])">A–B–C–D</button>
<button id="opt-5" onclick="startPoll(['A','B','C','D','E'])">A–B–C–D–E</button>

<!-- close button -->
<button onclick="closePoll()">CLOSE</button>

<!-- status -->
<pre id="status">Initializing…</pre>

<script>
const statusBox = document.getElementById("status");

const optButtons = {
  3: document.getElementById("opt-3"),
  4: document.getElementById("opt-4"),
  5: document.getElementById("opt-5")
};

let lastTotal = 0;
let lastChangeTime = Date.now();
let pollOpenTime = null;

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}

function bar(n, max) {
  if (max === 0) return "";
  return "█".repeat(Math.round(16 * n / max));  /* slightly narrower bars */
}

async function startPoll(opts) {
  await fetch("/set_options", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({options: opts})
  });

  await fetch("/open", {method: "POST"});

  pollOpenTime = Date.now();
  lastTotal = 0;
  lastChangeTime = Date.now();
  updateStatus();
}

async function closePoll() {
  await fetch("/close", {method: "POST"});
  updateStatus();
}

async function updateStatus() {
  const r = await fetch("/results");
  const j = await r.json();

  Object.values(optButtons).forEach(b => b.classList.remove("active"));
  if (j.open && optButtons[j.options.length]) {
    optButtons[j.options.length].classList.add("active");
  }

  let total = 0;
  let max = 0;
  j.options.forEach(k => {
    total += j.counts[k];
    max = Math.max(max, j.counts[k]);
  });

  if (total !== lastTotal) {
    lastTotal = total;
    lastChangeTime = Date.now();
  }

  const frozen = (Date.now() - lastChangeTime) > 10000;
  const elapsed = (j.open && pollOpenTime)
    ? formatTime(Date.now() - pollOpenTime)
    : "00:00";

  const lines = j.options.map(
    k => `${k}: ${bar(j.counts[k], max)} ${j.counts[k]}`
  );

  statusBox.textContent =
    `${j.open ? "OPEN" : "CLOSED"} | ${elapsed} | ${frozen ? "FROZEN" : "ACTIVE"}\n` +
    lines.join("\n");
}

updateStatus();
setInterval(updateStatus, 1000);
</script>

</body>
</html>
