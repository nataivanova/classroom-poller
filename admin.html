<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Poll Admin</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
  }
  button {
    font-size: 1.1em;
    margin: 5px;
    padding: 10px 15px;
  }
  button.active {
    background: #2c5aa0;
    color: white;
  }
  pre {
    background: #f4f4f4;
    padding: 15px;
    margin-top: 20px;
    font-size: 1.05em;
    line-height: 1.4;
  }
</style>
</head>

<body>

<h2>Poll Admin</h2>

<h3>Answer options</h3>
<button id="opt-3" onclick="setOptions(['A','B','C'])">A–B–C</button>
<button id="opt-4" onclick="setOptions(['A','B','C','D'])">A–B–C–D</button>
<button id="opt-5" onclick="setOptions(['A','B','C','D','E'])">A–B–C–D–E</button>

<h3>Control</h3>
<button onclick="openPoll()">OPEN POLL</button>
<button onclick="closePoll()">CLOSE POLL</button>

<h3>Status</h3>
<pre id="status">Initializing…</pre>

<script>
const statusBox = document.getElementById("status");
const optButtons = {
  3: document.getElementById("opt-3"),
  4: document.getElementById("opt-4"),
  5: document.getElementById("opt-5")
};

let lastTotal = 0;
let lastChangeTime = Date.now();
let pollOpenTime = null;

async function setOptions(opts) {
  await fetch("/set_options", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({options: opts})
  });
  pollOpenTime = null;
  lastTotal = 0;
  updateStatus();
}

async function openPoll() {
  await fetch("/open", {method:"POST"});
  pollOpenTime = Date.now();
  lastChangeTime = Date.now();
}

async function closePoll() {
  await fetch("/close", {method:"POST"});
}

function formatTime(ms) {
  const s = Math.floor(ms/1000);
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

async function updateStatus() {
  const r = await fetch("/results");
  const j = await r.json();

  Object.values(optButtons).forEach(b => b.classList.remove("active"));
  optButtons[j.options.length].classList.add("active");

  let total = 0;
  let max = 0;
  j.options.forEach(k => {
    total += j.counts[k];
    max = Math.max(max, j.counts[k]);
  });

  if (total !== lastTotal) {
    lastTotal = total;
    lastChangeTime = Date.now();
  }

  const frozen = Date.now() - lastChangeTime > 10000;
  const elapsed = (j.open && pollOpenTime) ? formatTime(Date.now()-pollOpenTime) : "00:00";

  let lines = j.options.map(k => `${k}: ${"█".repeat(max ? Math.round(20*j.counts[k]/max) : 0)} ${j.counts[k]}`);

  statusBox.textContent =
    `Poll: ${j.open ? "OPEN" : "CLOSED"}\n` +
    `Options: ${j.options.join(", ")}\n\n` +
    `Votes:\n${lines.join("\n")}\n\n` +
    `Total votes: ${total}\n` +
    `Time since open: ${elapsed}\n` +
    `Status: ${frozen ? "FROZEN" : "ACTIVE"}`;
}

updateStatus();
setInterval(updateStatus, 1000);
</script>

</body>
</html>
