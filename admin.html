<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Poll Admin</title>

<style>
body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
button { font-size: 1.1em; margin: 5px; padding: 10px 15px; }
button.active { background: #2c5aa0; color: white; }
pre { background: #f4f4f4; padding: 15px; margin-top: 20px; }
</style>
</head>

<body>

<h2>Poll Admin</h2>

<h3>Answer options</h3>
<button id="o3" onclick="setOptions(['A','B','C'])">A–B–C</button>
<button id="o4" onclick="setOptions(['A','B','C','D'])">A–B–C–D</button>
<button id="o5" onclick="setOptions(['A','B','C','D','E'])">A–B–C–D–E</button>

<h3>Control</h3>
<button onclick="openPoll()">OPEN</button>
<button onclick="closePoll()">CLOSE</button>

<h3>Status</h3>
<pre id="status">Initializing…</pre>

<script>
const statusBox = document.getElementById("status");
const optBtn = {3:o3, 4:o4, 5:o5};

let lastTotal = 0;
let lastChange = Date.now();
let openTime = null;

async function setOptions(opts) {
  await fetch("/set_options", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({options:opts})
  });
  openTime = null;
}

async function openPoll() {
  await fetch("/open",{method:"POST"});
  openTime = Date.now();
  lastChange = Date.now();
}

async function closePoll() {
  await fetch("/close",{method:"POST"});
}

function fmt(ms){
  const s=Math.floor(ms/1000);
  return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}

async function update() {
  const r = await fetch("/results");
  const j = await r.json();

  Object.values(optBtn).forEach(b=>b.classList.remove("active"));
  optBtn[j.options.length].classList.add("active");

  let total=0,max=0;
  j.options.forEach(o=>{
    total+=j.counts[o];
    max=Math.max(max,j.counts[o]);
  });

  if (total!==lastTotal){
    lastTotal=total;
    lastChange=Date.now();
  }

  const frozen = Date.now()-lastChange>10000;
  const elapsed = (j.open && openTime)?fmt(Date.now()-openTime):"00:00";

  let lines=j.options.map(o=>`${o}: ${"█".repeat(max?Math.round(20*j.counts[o]/max):0)} ${j.counts[o]}`);

  statusBox.textContent =
    `Poll: ${j.open?"OPEN":"CLOSED"}\n`+
    `Options: ${j.options.join(", ")}\n\n`+
    `Votes:\n${lines.join("\n")}\n\n`+
    `Total votes: ${total}\n`+
    `Time since open: ${elapsed}\n`+
    `Status: ${frozen?"FROZEN":"ACTIVE"}`;
}

update();
setInterval(update,1000);
</script>

</body>
</html>
