<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Poll Admin</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
  }
  button {
    font-size: 1.1em;
    margin: 5px;
    padding: 10px 15px;
  }
  button.active {
    background: #2c5aa0;
    color: white;
  }
  pre {
    background: #f4f4f4;
    padding: 15px;
    margin-top: 20px;
    font-size: 1.05em;
    line-height: 1.4;
  }
</style>
</head>

<body>

<h2>Poll Admin</h2>

<h3>Start poll (choose answers)</h3>
<button id="opt-3" onclick="startPoll(['A','B','C'])">A–B–C</button>
<button id="opt-4" onclick="startPoll(['A','B','C','D'])">A–B–C–D</button>
<button id="opt-5" onclick="startPoll(['A','B','C','D','E'])">A–B–C–D–E</button>

<h3>Control</h3>
<button onclick="closePoll()">CLOSE POLL</button>

<h3>Status</h3>
<pre id="status">Initializing…</pre>

<script>
const statusBox = document.getElementById("status");

const optButtons = {
  3: document.getElementById("opt-3"),
  4: document.getElementById("opt-4"),
  5: document.getElementById("opt-5")
};

let lastTotal = 0;
let lastChangeTime = Date.now();
let pollOpenTime = null;

/* ---------- helpers ---------- */
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}

function bar(n, max) {
  if (max === 0) return "";
  return "█".repeat(Math.round(20 * n / max));
}

/* ---------- start poll = set options + open ---------- */
async function startPoll(opts) {
  await fetch("/set_options", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({options: opts})
  });

  await fetch("/open", {method: "POST"});

  pollOpenTime = Date.now();
  lastTotal = 0;
  lastChangeTime = Date.now();

  updateStatus();
}

/* ---------- close poll ---------- */
async function closePoll() {
  await fetch("/close", {method: "POST"});
  updateStatus();
}

/* ---------- status update ---------- */
async function updateStatus() {
  const r = await fetch("/results");
  const j = await r.json();

  /* highlight active option set if poll is open */
  Object.values(optButtons).forEach(b => b.classList.remove("active"));
  if (j.open && optButtons[j.options.length]) {
    optButtons[j.options.length].classList.add("active");
  }

  let total = 0;
  let max = 0;
  j.options.forEach(k => {
    total += j.counts[k];
    max = Math.max(max, j.counts[k]);
  });

  if (total !== lastTotal) {
    lastTotal = total;
    lastChangeTime = Date.now();
  }

  const frozen = (Date.now() - lastChangeTime) > 10000;
  const elapsed = (j.open && pollOpenTime)
    ? formatTime(Date.now() - pollOpenTime)
    : "00:00";

  const lines = j.options.map(
    k => `${k}: ${bar(j.counts[k], max)} ${j.counts[k]}`
  );

  statusBox.textContent =
    `Poll: ${j.open ? "OPEN" : "CLOSED"}\n` +
    `Options: ${j.options.join(", ")}\n\n` +
    `Votes:\n${lines.join("\n")}\n\n` +
    `Total votes: ${total}\n` +
    `Time since open: ${elapsed}\n` +
    `Status: ${frozen ? "FROZEN (no new votes)" : "ACTIVE"}`;
}

/* ---------- auto refresh ---------- */
updateStatus();
setInterval(updateStatus, 1000);
</script>

</body>
</html>
